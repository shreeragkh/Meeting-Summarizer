[project]
name = "meeting-summarizer"
version = "0.1.0"
description = "Transcribe and summarize meeting recordings with structured action items"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "moviepy>=2.2.1",
    "openai>=1.40.0",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.3",
    "streamlit>=1.38.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meeting_summarizer"]